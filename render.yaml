# Déploiement « Blueprint » sur Render (https://render.com) : front + API + disque persistant pour SQLite
services:
  - type: web
    name: golf-finder
    runtime: node
    plan: starter # un disque persistant nécessite une offre payante (~7 $/mois)
    buildCommand: npm ci && npm run build && npm run seed
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: DATABASE_PATH
        value: /var/data/golf-finder.db
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: CONTACT_EMAIL
        sync: false
      - key: SHOW_DEMO_DATA
        value: 'true'
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
