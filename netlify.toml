# Déploiement Netlify : site (Vite) + API (Netlify Function « api », voir netlify/functions/api.mts)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # node:sqlite (utilisé par l'API) exige Node 22.13 ou plus récent
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  # PGlite ne sert qu'en local : jamais embarqué dans la fonction (en ligne, c'est Netlify Database)
  external_node_modules = ["@electric-sql/pglite"]

# Fichier d'une ancienne version absent : vraie erreur 404 (et non la page d'accueil), l'app se recharge alors
[[redirects]]
  from = "/assets/*"
  to = "/404"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Le site ne charge que ses propres scripts ; images de carte et photos en https ; polices Google
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
